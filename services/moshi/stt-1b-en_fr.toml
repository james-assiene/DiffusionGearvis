# moshi-server config for kyutai/stt-1b-en_fr.
# Source: kyutai-labs/delayed-streams-modeling configs/config-stt-en_fr-hf.toml (fetched 2026-09-12),
# with three local changes: log_dir/instance_name renamed, batch_size 64 → 2 (docs/06 R2: the
# idle-spin bug #390 and our single-user load). Everything under [modules.asr.model] is verbatim.
# The 4 "extra heads" (dim 6) are the pause-prediction heads carried in SttStep.pause_heads.
static_dir = "./static/"
log_dir = "/logs"                        # absolute: TOML does no shell expansion, and a relative
                                        # or $HOME-prefixed path lands in the container FS and dies with --rm
instance_name = "astra-stt"
authorized_ids = ["public_token"]

[modules.asr]
path = "/api/asr-streaming"
type = "BatchedAsr"
lm_model_file = "hf://kyutai/stt-1b-en_fr-candle/model.safetensors"
text_tokenizer_file = "hf://kyutai/stt-1b-en_fr-candle/tokenizer_en_fr_audio_8000.model"
audio_tokenizer_file = "hf://kyutai/stt-1b-en_fr-candle/mimi-pytorch-e351c8d8@125.safetensors"
asr_delay_in_tokens = 6
batch_size = 2
conditioning_learnt_padding = true
temperature = 0.0

[modules.asr.model]
audio_vocab_size = 2049
text_in_vocab_size = 8001
text_out_vocab_size = 8000
audio_codebooks = 32

[modules.asr.model.transformer]
d_model = 2048
num_heads = 16
num_layers = 16
dim_feedforward = 8192
causal = true
norm_first = true
bias_ff = false
bias_attn = false
context = 750
max_period = 100000
use_conv_block = false
use_conv_bias = true
gating = "silu"
norm = "RmsNorm"
positional_embedding = "Rope"
conv_layout = false
conv_kernel_size = 3
kv_repeat = 1
max_seq_len = 40960

[modules.asr.model.extra_heads]
num_heads = 4
dim = 6
