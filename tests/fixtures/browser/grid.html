<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-0111c grid</title>
<style>
  html, body { margin: 0; overflow: hidden; }
  /* One element covering the whole viewport, so every CSS pixel a pointer lands on is #grid's. */
  #grid { position: fixed; inset: 0;
          background:
            repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 64px),
            repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 64px),
            linear-gradient(135deg, #f6d365, #3fa7d6); }
</style>
<script src="recorder.js"></script>
</head>
<body>
<div id="grid"></div>
</body>
</html>
