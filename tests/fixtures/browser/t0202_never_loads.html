<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-0202 never loads</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #fff; font: 20px sans-serif; }
  /* a header bar and a "loading" line that never change: the results never come */
  #header { position: absolute; left: 0; top: 100px; width: 1280px; height: 60px; background: rgb(50, 50, 50);
            color: #fff; }
  #loading { position: absolute; left: 140px; top: 250px; color: #333; }
</style>
</head>
<body>
<div id="header">results for your search</div>
<div id="loading">loading results</div>
</body>
</html>
