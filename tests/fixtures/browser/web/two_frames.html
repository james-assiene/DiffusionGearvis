<html lang="en">
<head><meta charset="utf-8"><title>Two frames</title>
<style>body{margin:0;font:24px sans-serif}iframe{position:absolute;left:100px;width:700px;height:160px;border:2px solid #333}

<body>

<iframe id="second" src="https://pay.example/card_iframe.html" title="second"></iframe>
</body>
