<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title>
<style>body{margin:0;font:24px sans-serif}input{position:absolute;left:100px;width:600px;height:60px;font:24px sans-serif}
#username{top:100px}#password{top:300px}</style></head>
<body>
<label for="username">User name</label><input id="username" name="username" type="text" autocomplete="username">
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password">
</body>
</html>
