<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Note</title>
<style>body{margin:0;font:24px sans-serif}#note{position:absolute;left:100px;top:100px;width:600px;height:60px;font:24px sans-serif}</style></head>
<body>
<!-- a plain text field that becomes a password field when it gets focus: the guard must read after the click -->
<input id="note" name="note" type="text" onfocus="this.type='password'">
</body>
</html>
