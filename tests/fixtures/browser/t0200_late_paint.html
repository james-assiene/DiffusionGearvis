<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-0200 late paint</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #fff; }
  /* painted after ?ms= (default 1500): a 600x300 block centred on (640, 400) of the 1280x800 viewport, with text;
     the block is a link to this page with the default delay (a click navigates to a page that paints late) */
  #block { position: absolute; left: 340px; top: 250px; width: 600px; height: 300px; background: rgb(0, 90, 200);
           color: #fff; font: 32px sans-serif; display: block; text-decoration: none; }
</style>
</head>
<body>
<script>
  // Nothing is painted until the delay ends: the body is plain white, as a page still waiting for its content.
  const ms = Number(new URLSearchParams(location.search).get("ms") ?? "1500");
  setTimeout(() => {
    const a = document.createElement("a");
    a.id = "block";
    a.href = "t0200_late_paint.html";
    a.textContent = "painted";
    document.body.appendChild(a);
  }, ms);
</script>
</body>
</html>
