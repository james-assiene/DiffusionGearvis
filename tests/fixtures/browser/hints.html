<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-0111c resource hints</title>
<script>
  // ?a=<host:port>: DNS-prefetch and preconnect hints in the parsed head, with and without crossorigin.
  const a = new URLSearchParams(location.search).get("a");
  if (a) {
    document.write(
      `<link rel="dns-prefetch" href="//${a}">` +
      `<link rel="preconnect" href="http://${a}">` +
      `<link rel="preconnect" href="http://${a}" crossorigin>`
    );
  }
</script>
<script src="recorder.js"></script>
</head>
<body style="margin:0;background:#fff">hints</body>
</html>
