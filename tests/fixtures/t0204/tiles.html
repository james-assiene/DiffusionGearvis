<div id="tail"></div>
<script>
window.__clicked = [];
window.__input = 0;
for (const ev of ["pointerdown", "mousedown", "keydown", "wheel", "touchstart"]) {
  addEventListener(ev, () => { window.__input++; }, true);
}
document.querySelectorAll(".t").forEach((t) => t.addEventListener("click", () => window.__clicked.push(+t.dataset.n)));
function block(px, color, id) {
  const d = document.createElement("div");
  d.id = id;
  d.style.cssText = "height:" + px + "px;background:" + color;
  return d;
}
window.t0204 = {
  insertAbove(px) { document.getElementById("grid").before(block(px, "rgb(200, 30, 30)", "above")); },
  insertBelow(px) { document.getElementById("tail").after(block(px, "rgb(30, 200, 30)", "below")); },
  insertBelowGrid(px) { document.getElementById("grid").after(block(px, "rgb(30, 200, 30)", "below")); },
  transformGrid(px) { document.getElementById("grid").style.transform = "translateY(" + px + "px)"; },
};
const lazy = Number(new URLSearchParams(location.search).get("lazy")) || 0;
if (lazy) {
  let done = false;
  addEventListener("scroll", () => {
    if (done) return;
    done = true;
    setTimeout(() => window.t0204.insertAbove(lazy), 50);
  }, { passive: true });
}
</script>
