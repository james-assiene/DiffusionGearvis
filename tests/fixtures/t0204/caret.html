<!doctype html>
<html><head><meta charset="utf-8"><title>t0204 caret</title>
<style>
html, body { margin: 0; padding: 0; background: rgb(250, 250, 250); }
#q { position: absolute; left: 340px; top: 380px; width: 600px; height: 40px; box-sizing: border-box;
     border: 1px solid rgb(120, 120, 120); padding: 0 4px; font: 24px sans-serif; color: rgb(20, 20, 20);
     background: rgb(255, 255, 255); outline: none; }
#drawn { position: absolute; left: 345px; top: 389px; width: 2px; height: 22px; background: rgb(0, 0, 0); display: none; }
#label { position: absolute; left: 340px; top: 330px; font: 20px sans-serif; color: rgb(60, 60, 60); }
</style></head>
<body>
<div id="label">Search</div>
<input id="q" type="text" autocomplete="off">
<div id="drawn"></div>
<script>
window.__keys = 0;
window.__clicks = 0;
addEventListener("keydown", () => { window.__keys++; }, true);
addEventListener("click", () => { window.__clicks++; }, true);
if (new URLSearchParams(location.search).get("drawn")) {
  const c = document.getElementById("drawn");
  let on = true;
  c.style.display = "block";
  setInterval(() => { on = !on; c.style.visibility = on ? "visible" : "hidden"; }, 530);
}
</script>
</body></html>
