<!doctype html><html><head><meta charset="utf-8"><style>body{font:16px sans-serif;margin:24px} input,textarea,button{display:block;margin:8px 0;font-size:16px;padding:6px;width:320px} button{width:auto}</style><title>t0206 SPA quote form under a header search box</title><script>window.__sent=0;</script></head><body>
<header style="background:#eee;padding:8px"><input name="q" id="q" placeholder="Search the site" aria-label="Search"></header>
<h1 style="font-size:20px">Get a quote</h1>
<label>Name <input name="name" id="name"></label>
<label>Email <input type="email" name="email" id="email"></label>
<label>Message <textarea name="message" id="message" rows="2"></textarea></label>
<div role="button" id="go" tabindex="0" style="display:inline-block;padding:8px 16px;background:#36c;color:#fff" onclick="window.__sent++">Send</div>
</body></html>
