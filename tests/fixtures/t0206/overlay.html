<!doctype html><html><head><meta charset="utf-8"><style>body{font:16px sans-serif;margin:24px} input,textarea,button{display:block;margin:8px 0;font-size:16px;padding:6px;width:320px} button{width:auto}</style><title>t0206 overlay forwards the click</title></head><body><form action="/sent" method="post" id="f" style="position:relative"><label>Email <input type="email" name="email" id="email"></label><button id="go">Send</button><div id="overlay" style="position:absolute;background:transparent" onclick="document.getElementById('f').requestSubmit()"></div></form><script>
const b = document.getElementById("go"), o = document.getElementById("overlay");
o.style.left = (b.offsetLeft - 4) + "px"; o.style.top = (b.offsetTop - 4) + "px";
o.style.width = (b.offsetWidth + 8) + "px"; o.style.height = (b.offsetHeight + 8) + "px";
</script></body></html>
