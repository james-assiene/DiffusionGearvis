<!doctype html><html><head><meta charset="utf-8"><style>body{font:16px sans-serif;margin:24px} input,textarea,button{display:block;margin:8px 0;font-size:16px;padding:6px;width:320px} button{width:auto}</style><title>t0206 shadow-root send</title><script>window.__sent=0;</script></head><body><label>Your message <textarea id="message" rows="3"></textarea></label><x-send id="host"></x-send><script>
customElements.define("x-send", class extends HTMLElement { constructor(){ super(); const r=this.attachShadow({mode:"open"}); r.innerHTML='<div role="button" id="go" style="display:inline-block;padding:8px 16px;background:#36c;color:#fff">Send message</div>'; r.getElementById("go").addEventListener("click",()=>{window.__sent++;}); } });
</script></body></html>
