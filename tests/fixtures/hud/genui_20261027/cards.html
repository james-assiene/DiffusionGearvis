<style>
/* ---- The HUD's own token layer, copied verbatim from hud/styles.css (:root = dark, one light block). ---- */
:root {
  /* Native controls (the checkboxes, the select, the scrollbars) are drawn in the color-scheme,
     not in the tokens, so it follows data-theme too. */
  color-scheme: dark;

  /* --- dark: the mockup's tokens.css, moved until the floors hold ---------------------------
     Mockup name -> the name the page (and the panels this task does not own) consume:
       --text -> --ink and --fg   --text-2 -> --dim   --muted -> --muted   --line -> --edge
       --amber -> --warn   --red -> --bad   --green -> --ok   --*-soft -> --*-soft
     Moved (WCAG 2.1, measured by tests/integration/test_hud_chrome.py):
       --bg #0d0f13 -> #0b0d11 and --surface #14171d -> #1b1e26: page to pane was 1.07:1, the
         floor is 1.15:1 (Ruling O1); now 1.17:1.
       --muted #7d8597 -> #9aa1b2: 4.04:1 on --surface-3, now 5.10:1.
       --faint #4b5262 -> #939bad: the mockup's 2.29:1 is a placeholder colour; here --faint is
         tertiary *text* (the counters' labels, an empty line, an unavailable assist), >= 4.5:1
         on every surface. */
  --bg: #0b0d11;
  /* T-0154 A2/A3: the mockup's page gradient, painted over --bg (body, fixed to the window). */
  --bg-grad: radial-gradient(1200px 600px at 15% -10%, #18203a 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #1b1730 0%, transparent 55%);
  --surface: #1b1e26; /* a pane */
  --surface-2: #22262f; /* a control or a card on a pane */
  --surface-3: #2b303c; /* a control under the pointer, the meter's track */
  /* What the user said: the mockup's --bubble (T-0154 ruling O-B (4)). */
  --bubble: #1f2430;
  /* T-0154 B12: the composer's fill is the mockup's --surface-2 as painted (#1a1e26). The page's
     own --surface-2 moved with --surface for contrast, so the composer keeps the mockup's value
     under its own name; its 1 px --line edge is its boundary, as in the mockup. */
  --composer: #1a1e26;
  --ink: #eceef3;
  --fg: #eceef3; /* what hud/src/ui/style.css paints the model's surface in */
  --dim: #b4bac8; /* secondary text: headings, captions, placeholders */
  --muted: #9aa1b2;
  --faint: #939bad;
  --edge: #2c313c; /* a separator inside a pane */
  /* T-0154 A2/A3: the mockup's hairline on a pane and a header button (supersedes T-0056 A12's
     borderless panes by name); the tonal step above stays the pane's real boundary. */
  --line: rgb(255 255 255 / 0.07);
  /* T-0154 B12: the mockup's stronger hairline (the action chip's dashed edge). */
  --line-strong: rgb(255 255 255 / 0.12);
  /* T-0154 B12: the mockup's soft amber behind the DRY RUN tag. */
  --amber-soft: rgb(245 194 107 / 0.14);
  /* The pill and the focus ring keep a painted edge at >= 3.0:1 (T-0056 ruling A12). */
  --edge-strong: #6e7790;
  --accent: #8ea2ff;
  --accent-2: #b48cff;
  --accent-dim: #7086f0;
  /* T-0154 A2: the mockup's rgba(142,162,255,0.14) composited over its page, kept opaque so the
     pill's text contrast does not depend on what is behind the header. */
  --accent-soft: #1f2434;
  --logo-glow: 0 0 24px rgb(142 162 255 / 0.35);
  --knob-on: #ffffff; /* the knob of a switch that is on */
  --on-accent: #0b0d11;
  --tonal: #8ea2ff; /* a primary button: fill... */
  --tonal-ink: #0b0d11; /* ...and its label */
  --tonal-hover: #a6b5ff;
  /* A neutral control that must read as one (an inactive tab): >= 3.0:1 against --surface and
     --surface-2, its label >= 4.5:1 on it. */
  --control: #646f8a;
  --on-control: #ffffff;
  --ok: #5ee09a;
  --ok-soft: #16302a;
  --warn: #f5c26b;
  --warn-soft: #33291a;
  --warn-surface: var(--warn-soft);
  --bad: #ff8a97;
  --bad-surface: #3a1e24;
  --ring: #8ea2ff;
  --track: #2b303c; /* the unfilled part of the thinking bar */
  --elev: 0 1px 0 rgb(255 255 255 / 0.04) inset, 0 10px 30px rgb(0 0 0 / 0.35);
  /* T-0154 C2: the mockup's card shadow, read by hud/src/ui/card.css inside each surface. */
  --card-shadow: 0 1px 0 rgb(255 255 255 / 0.05) inset, 0 12px 32px rgb(0 0 0 / 0.3);
  --spark: linear-gradient(135deg, #8ea2ff, #b48cff);
  --on-spark: #0b0d11;
  /* T-0159 B-6: the text of a denoising-view cell, one ink per state fill (the fills are the
     T-0128c B3 colours composited over --surface). WCAG 2.1 contrast on the fill:
     settled (stable, committed) 8.1:1 on #8ea2ff; kept 5.8:1 on #4f5988; revised 7.5:1 on
     #b48cff; noise, deliberately dim, 3.8:1 on #292e40 (floor 3:1). */
  --dn-ink-settled: #0b0d11;
  --dn-ink-kept: #eceef3;
  --dn-ink-revised: #0b0d11;
  --dn-ink-noise: #80879b;

  /* --- type: system stacks, zero bytes fetched --- */
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif;
  --mono: ui-monospace, "DejaVu Sans Mono", monospace;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-ui: 13.5px; /* header buttons and the state pill */
  --text-base: 15px;
  --text-lg: 16px;

  /* --- 4 px rhythm --- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --gap: 18px; /* between panes, the mockup's rail rhythm */
  --gap-col: 22px; /* between the conversation and the rail */
  --frame-max: 1480px; /* the app frame (T-0154 A2) */

  --radius-sm: 8px;
  --radius-btn: 12px;
  --radius-md: 18px; /* a card on a pane */
  --radius-lg: 22px; /* a pane */
  --radius-pill: 999px;

  --bar-h: 36px;
  --rail: 380px; /* the right rail (T-0128 criterion 4) */

  /* hud/src/panels/thinking.js writes this inline on #thinking-bar; this is the idle value. */
  --fill: 0%;
}

/* --- light: re-binds tokens, nothing else ------------------------------------------------------
   Moved from the mockup: --bg #f4f5f8 -> #e9ebf1 (page to pane 1.09:1 -> 1.19:1); --accent
   #4f63e6 -> #4052d6 (4.13:1 on --surface-3 and on its soft fill, now >= 5.0:1); --green #149a5a
   -> #107a47, --amber #b7791f -> #8a5a0f, --red #d6455a -> #b8283e (3.0-4.3:1 on a card, now
   >= 4.5:1 on every surface); --faint #a7adbb -> #596175 (tertiary text, >= 5.1:1). */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e9ebf1;
  --bg-grad: radial-gradient(1200px 600px at 15% -10%, #e6eaff 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #f1e9ff 0%, transparent 55%);
  --surface: #ffffff;
  --surface-2: #f4f5f9;
  --surface-3: #e8ebf2;
  --bubble: #eef1fb;
  --composer: #f7f8fb;
  --ink: #141822;
  --fg: #141822;
  --dim: #3b4252;
  --muted: #5d6579;
  --faint: #596175;
  --edge: #e3e6ed;
  --line: rgb(15 20 35 / 0.07);
  --line-strong: rgb(15 20 35 / 0.12);
  --amber-soft: rgb(183 121 31 / 0.1);
  --edge-strong: #767e92;
  --accent: #4052d6;
  --accent-2: #7a4fe0;
  --accent-dim: #5a6be0;
  /* the mockup's rgba(79,99,230,0.10) over its light page; the moved --accent is 4.9:1 on it */
  --accent-soft: #e4e6f6;
  --knob-on: #ffffff;
  --on-accent: #ffffff;
  --tonal: #4052d6;
  --tonal-ink: #ffffff;
  --tonal-hover: #3444c2;
  --control: #5d6579;
  --on-control: #ffffff;
  --ok: #107a47;
  --ok-soft: #e0f3e9;
  --warn: #8a5a0f;
  --warn-soft: #fbf0dc;
  --bad: #b8283e;
  --bad-surface: #fce8eb;
  --ring: #4052d6;
  --track: #e1e4ec;
  --elev: 0 1px 2px rgb(15 20 35 / 0.04), 0 8px 24px rgb(15 20 35 / 0.06);
  --card-shadow: 0 1px 2px rgb(15 20 35 / 0.05), 0 10px 28px rgb(15 20 35 / 0.07);
  --spark: linear-gradient(135deg, #4052d6, #7a4fe0);
  --on-spark: #ffffff;
  /* T-0159 B-6, over #ffffff: settled 6.2:1 on #4052d6; kept 8.6:1 on #a9b1ed; revised 5.2:1 on
     #7a4fe0; noise 3.8:1 on #e8eafa. */
  --dn-ink-settled: #ffffff;
  --dn-ink-kept: #141822;
  --dn-ink-revised: #ffffff;
  --dn-ink-noise: #6f768b;
}

/* ---- Mock page chrome (not part of the proposal) ---- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg-grad), var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--text-base);
  line-height: 1.5;
  padding: 28px 16px 40px;
}
.page { max-width: 1160px; margin: 0 auto; }
.page > header { margin-bottom: 22px; }
.page h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 6px; }
.page .lede { color: var(--dim); margin: 0; max-width: 820px; font-size: 14px; }
.page .lede code { font-family: var(--mono); font-size: 12.5px; }
.pair { margin-top: 30px; }
.pair-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin: 0 0 12px; }
.pair-head h2 { font-size: 15px; font-weight: 650; margin: 0; }
.pair-head .src { color: var(--muted); font-size: 12px; font-family: var(--mono); overflow-wrap: anywhere; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 520px)); gap: 24px; justify-content: start; }
.pair { max-width: 520px; }
@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 520px); } }
.col-label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.col-label b { color: var(--accent); font-weight: 650; }
/* Both columns sit on the conversation pane, as the card does in the HUD (.pane = --surface). */
.pane-bg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; }
.today img { display: block; width: 100%; max-width: 488px; height: auto; }
:root[data-theme="dark"] .today .shot-light, :root[data-theme="light"] .today .shot-dark { display: none; }

/* =====================================================================================
   OPTION A — the proposed card sheet. Every colour is a HUD token; no literal.
   ===================================================================================== */
.ga-card {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  box-shadow: var(--card-shadow);
  padding: 18px 20px 20px;
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--text-base);
  line-height: 1.5;
  max-width: 488px;
}
:root[data-theme="light"] .ga-card { background: var(--surface); }
.ga-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ga-row { display: flex; flex-direction: row; gap: 12px; align-items: center; min-width: 0; }
.ga-row > * { min-width: 0; }

/* text */
.ga-t { margin: 0; overflow-wrap: anywhere; }
.ga-h1 { font-size: 22px; font-weight: 650; line-height: 1.25; letter-spacing: -0.015em; }
.ga-h2 { font-size: 19px; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
.ga-h3 { font-size: 17px; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
.ga-h4, .ga-h5 { font-size: 15px; font-weight: 600; line-height: 1.35; }
.ga-body { font-size: var(--text-base); color: var(--ink); }
.ga-caption { font-size: 12.5px; color: var(--muted); }
/* the card's first heading is its title: a little more air under it */
.ga-card > .ga-col > .ga-t:first-child:is(.ga-h1, .ga-h2, .ga-h3) { margin-bottom: 2px; }

/* key / value rows (a Row of exactly two Texts the model did not justify) */
.ga-kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: baseline; padding: 7px 0; }
.ga-kv .ga-k { color: var(--muted); }
.ga-kv .ga-v { color: var(--ink); font-weight: 550; text-align: right; font-variant-numeric: tabular-nums; }
.ga-col > .ga-kv + .ga-kv { border-top: 1px solid var(--line); margin-top: -12px; }
.ga-col > .ga-kv:has(+ .ga-kv) { margin-bottom: 0; }
.ga-hr + .ga-kv .ga-k { color: var(--ink); font-weight: 600; }
.ga-hr + .ga-kv .ga-v { font-weight: 700; }

/* divider */
.ga-hr { border: 0; border-top: 1px solid var(--line-strong); margin: -4px 0; align-self: stretch; }
.ga-hr.v { border-top: 0; border-left: 1px solid var(--line-strong); margin: 0; align-self: stretch; }

/* list: abutting rows, a hairline between */
.ga-list { display: flex; flex-direction: column; margin: 0; padding: 0; }
.ga-list > .ga-li { padding: 9px 0; }
.ga-list > .ga-li + .ga-li { border-top: 1px solid var(--line); }
.ga-list.h { flex-direction: row; gap: 8px; overflow-x: auto; }
.ga-list.h > .ga-li { padding: 0; border: 0; }

/* a Card inside the card: a quiet tonal tile, never a second floating card */
.ga-tile { background: var(--surface-3); border-radius: var(--radius-btn); padding: 11px 14px; }
:root[data-theme="light"] .ga-tile { background: var(--surface-2); }
.ga-tile > .ga-col { gap: 6px; }
.ga-col:has(> .ga-tile) { gap: 8px; }
.ga-col:has(> .ga-tile) > .ga-t:first-child { margin-bottom: 4px; }

/* form fields: label above control */
.ga-field { display: flex; flex-direction: column; gap: 6px; }
.ga-field > .ga-flabel, .ga-flabel { font-size: var(--text-sm); font-weight: 550; color: var(--dim); }
.ga-input {
  font: inherit; font-size: 14.5px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--edge-strong); border-radius: var(--radius-btn);
  padding: 9px 12px; width: 100%; min-width: 0;
}
:root[data-theme="light"] .ga-input { background: var(--surface); }
.ga-input::placeholder { color: var(--faint); }
.ga-input:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; border-color: transparent; }
.ga-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* choice picker: chips */
.ga-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ga-chip {
  font: inherit; font-size: 13.5px; font-weight: 550; color: var(--dim); cursor: pointer;
  background: transparent; border: 1px solid var(--edge-strong); border-radius: var(--radius-pill);
  padding: 5px 13px; min-width: 38px;
}
.ga-chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* checkbox */
.ga-check { display: flex; gap: 10px; align-items: center; color: var(--ink); }
.ga-check input { appearance: none; width: 18px; height: 18px; margin: 0; flex: none; border: 1.5px solid var(--edge-strong); border-radius: 6px; }
.ga-check input:checked { background: var(--accent); border-color: var(--accent); }

/* slider */
.ga-range { width: 100%; accent-color: var(--accent); }

/* buttons */
.ga-btn {
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; align-self: flex-start;
  border-radius: var(--radius-pill); padding: 9px 18px; border: 1px solid transparent;
  background: var(--surface-3); color: var(--ink);
}
.ga-btn.primary { background: var(--tonal); color: var(--tonal-ink); }
.ga-btn.borderless { background: transparent; color: var(--accent); padding-inline: 4px; }
.ga-btn .ga-t { color: inherit; font: inherit; }
.ga-col > .ga-btn:last-child { margin-top: 4px; }

/* tabs: a segmented control */
.ga-tabs-bar { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-3); border-radius: var(--radius-pill); align-self: flex-start; }
.ga-tab { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: transparent; color: var(--dim); border-radius: var(--radius-pill); padding: 5px 12px; cursor: pointer; }
.ga-tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--elev); }

/* media */
.ga-img { display: block; max-width: 100%; border-radius: var(--radius-btn); background: var(--surface-3); }
.ga-img.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.ga-img.icon { width: 24px; height: 24px; }
.ga-img.header { width: 100%; aspect-ratio: 16/7; object-fit: cover; }
.ga-icon { width: 18px; height: 18px; color: var(--dim); flex: none; }
.ga-missing { color: var(--faint); font-size: 12px; font-family: var(--mono); }
</style>
</head>
<body>
<div class="page">
  <header><h1>GenUI cards: option A</h1></header>
  <div id="pairs"></div>
</div>

/* ============================== OPTION A RENDERER ==============================
   renderSurface(messages) -> HTMLElement

   ============================================================================== */

  const h = (tag, cls, attrs) => {

    const parts = path.split("/").filter(Boolean); let o = obj;
    for (const p of parts.slice(0, -1)) o = (o[p] ??= {});
    o[parts[parts.length - 1]] = value;
  }

    return String(path || "").split("/").filter(Boolean).reduce((o, p) => (o == null ? undefined : o[p]), obj);

  function render(ctx, id, depth) {
    const c = ctx.comps.get(id);
    if (!c) return null;                       // dangling reference: render nothing, synthesise nothing

  function renderSurface(messages, onAction) {
    const { comps, data } = build(messages);

    for (let i = 0; i < 4; i++) {
