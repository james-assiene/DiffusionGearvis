<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chart card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#a6b5ff}a:hover{color:#c7d1ff}
</style>
</helmet>
<div style="width: 880px; height: 760px; box-sizing: border-box; padding: 40px 56px; background: #0b0d11; color: #eceef3; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px; font-variant-numeric: tabular-nums;">

  <div style="display: flex; justify-content: flex-end;">
    <div style="max-width: 520px; background: #1f2430; border: 1px solid rgb(255 255 255 / 0.07); border-radius: 18px 18px 4px 18px; padding: 12px 16px; font-size: 15px; line-height: 1.5;">How high is Everest compared to other mountains?</div>
  </div>

  <div style="display: flex; gap: 14px; align-items: flex-start;">
    <div aria-hidden="true" style="flex: 0 0 32px; width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, #8ea2ff, #b48cff); box-shadow: 0 0 24px rgb(142 162 255 / 0.35);"></div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px;">
      <p style="margin: 4px 0 0; font-size: 16px; line-height: 1.55;">Everest is 8,849 metres, only about 240 metres above K2, but almost twice the height of Mont Blanc.</p>

      <section aria-label="Mountain heights" style="background: #171a22; border: 1px solid rgb(255 255 255 / 0.08); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 0 rgb(255 255 255 / 0.05) inset, 0 12px 32px rgb(0 0 0 / 0.3);">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-size: 15px; font-weight: 600;">Summit height</span>
          <span style="font-size: 12px; color: #939bad;">metres above sea level</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div style="display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 14px;">
            <span style="font-size: 14px; font-weight: 600;">Everest</span>
            <div style="display: flex; align-items: center; gap: 10px;"><div style="width: 98.3%; height: 22px; border-radius: 6px; background: linear-gradient(90deg, #7086f0, #8ea2ff);"></div><span style="font-size: 13px; font-weight: 600; white-space: nowrap;">8,849</span></div>
          </div>
          <div style="display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 14px;">
            <span style="font-size: 14px; color: #b4bac8;">K2</span>
            <div style="display: flex; align-items: center; gap: 10px;"><div style="width: 95.7%; height: 22px; border-radius: 6px; background: #3a4258;"></div><span style="font-size: 13px; color: #b4bac8; white-space: nowrap;">8,611</span></div>
          </div>
          <div style="display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 14px;">
            <span style="font-size: 14px; color: #b4bac8;">Kangchenjunga</span>
            <div style="display: flex; align-items: center; gap: 10px;"><div style="width: 95.4%; height: 22px; border-radius: 6px; background: #3a4258;"></div><span style="font-size: 13px; color: #b4bac8; white-space: nowrap;">8,586</span></div>
          </div>
          <div style="display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 14px;">
            <span style="font-size: 14px; color: #b4bac8;">Mont Blanc</span>
            <div style="display: flex; align-items: center; gap: 10px;"><div style="width: 53.4%; height: 22px; border-radius: 6px; background: #3a4258;"></div><span style="font-size: 13px; color: #b4bac8; white-space: nowrap;">4,806</span></div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 140px 1fr; gap: 14px;">
          <span></span>
          <div style="display: flex; justify-content: space-between; font-size: 11px; color: #939bad; border-top: 1px solid rgb(255 255 255 / 0.08); padding-top: 6px; margin-right: 52px;"><span>0</span><span>3,000</span><span>6,000</span><span>9,000</span></div>
        </div>

        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #939bad; padding: 4px 10px; border-radius: 999px; background: rgb(255 255 255 / 0.05);">
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"></path><path d="M8 9h8M8 13h8M8 17h5"></path></svg>
            en.wikipedia.org
          </span>
        </div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
