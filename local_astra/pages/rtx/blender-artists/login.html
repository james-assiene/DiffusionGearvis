<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Blender Artists Community (demo copy)</title>
  <link rel="stylesheet" href="/assets/rtx.css">
</head>
<body class="forum" data-page-id="forum-login">
  <header class="site-bar">
    <span class="site-name">Blender Artists Community</span>
    <a href="/blender-artists/">Latest</a>
    <span class="host">blenderartists.org</span>
  </header>
  <main>
    <h1>Log in to reply</h1>
    <form id="signin-form" autocomplete="off">
      <label for="username">Username or email</label>
      <input type="text" id="username" name="username" data-scn="username" data-signin="username" autocomplete="off">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" data-scn="password" data-signin="password" autocomplete="off">
      <p><button type="submit" data-scn="signin">Log in</button></p>
    </form>
    <p class="notice" id="signin-message" role="status"></p>
    <p><a href="/blender-artists/">Back to the latest topics</a></p>
  </main>
  <footer>Demo copy for testing; not affiliated with Blender Artists or the Blender Foundation. Facts on this page are invented.</footer>
  <script src="/assets/rtx.js"></script>
</body>
</html>
