<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Delivery options</title>
  <link rel="stylesheet" href="/assets/suite.css">
</head>
<body data-page="delivery">
  <header class="bar">
    <span class="brand">Parcelway</span>
    <span class="badge">Order 4471</span>
  </header>
  <main class="page">
    <h1>How should we deliver your order?</h1>
    <p class="lede">Pick one option from the list, then save it. The list scrolls.</p>
    <div class="delivery">
      <div class="panel" id="options">
        <div class="panel-head">Delivery and pickup options</div>
      </div>
      <div class="side">
        <h2>Your parcel</h2>
        <p class="muted">One box, 2.4 kg. Lockers hold a parcel for three days; store pickup holds it for a week.</p>
        <div class="save-row">
          <button type="button" data-suite="save" id="save">Save</button>
          <span id="saved" class="status"></span>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/suite.js"></script>
</body>
</html>
