<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Your basket</title>
  <link rel="stylesheet" href="/assets/suite.css">
</head>
<body data-page="order">
  <header class="bar">
    <span class="brand">Linen and Oak</span>
    <span class="badge">Basket: 2 items</span>
  </header>
  <main class="page">
    <h1>Your basket</h1>
    <p class="lede">Each press of Place order places a new order and takes a new payment.</p>
    <div class="summary">
      <div class="line"><span>Linen tea towels, set of two</span><span>&pound;12.00</span></div>
      <div class="line"><span>Oak chopping board</span><span>&pound;35.00</span></div>
      <div class="line"><span>Delivery</span><span>&pound;3.50</span></div>
      <div class="line total"><span>Total</span><span>&pound;50.50</span></div>
      <div class="actions">
        <button type="button" id="place" data-suite="place">Place order</button>
        <span id="placed" class="status"></span>
      </div>
    </div>
  </main>
  <script src="/assets/suite.js"></script>
</body>
</html>
