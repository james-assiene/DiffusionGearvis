<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Choose your seats</title>
  <link rel="stylesheet" href="/assets/suite.css">
</head>
<body data-page="seats">
  <header class="bar">
    <span class="brand">Northlight Cinema</span>
    <span class="badge">Screen 3, 19:45</span>
  </header>
  <main class="page">
    <h1>Choose your seats</h1>
    <p class="lede">Click a seat to select it; click it again to release it. Rows run from A at the front to L at the back.</p>
    <div class="screen">SCREEN</div>
    <div id="seats"></div>
    <p class="legend"><span id="chosen" class="status">No seat selected</span></p>
  </main>
  <script src="/assets/suite.js"></script>
</body>
</html>
