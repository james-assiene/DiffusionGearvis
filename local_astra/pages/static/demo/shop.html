<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mug shop</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="shop">
  <header class="bar">
    <a class="brand" href="/">Astra</a>
    <span class="cart-badge" data-cart-count>Cart: 0 items</span>
  </header>
  <main class="page">
    <h1>Mugs</h1>
    <p class="lede">Glazed stoneware, made in small batches. Free delivery on every order.</p>
    <section class="grid">
      <article class="card">
        <div class="swatch tint-red"><div class="mug mug-red"></div></div>
        <h2>Red mug</h2>
        <p class="note">Glossy finish, 350 ml.</p>
        <div class="price">$12.00</div>
        <button type="button" data-item="red mug">Add to cart</button>
      </article>
      <article class="card">
        <div class="swatch tint-blue"><div class="mug mug-blue"></div></div>
        <h2>Blue mug</h2>
        <p class="note">Speckled glaze, 350 ml.</p>
        <div class="price">$12.00</div>
        <button type="button" data-item="blue mug">Add to cart</button>
      </article>
      <article class="card">
        <div class="swatch tint-green"><div class="mug mug-green"></div></div>
        <h2>Green mug</h2>
        <p class="note">Matte finish, 350 ml.</p>
        <div class="price">$13.00</div>
        <button type="button" data-item="green mug">Add to cart</button>
      </article>
    </section>
  </main>
  <script src="/assets/cart.js"></script>
</body>
</html>
