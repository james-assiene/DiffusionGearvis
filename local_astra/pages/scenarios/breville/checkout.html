<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout | Breville</title>
  <link rel="stylesheet" href="/assets/scenarios.css">
</head>
<body class="breville shop" data-page="checkout" data-scenario="d4">
  <header class="bar">
    <a class="brand" href="/breville/">Breville</a>
    <nav><a href="/breville/cart.html" data-scn="nav-cart">Cart (<span id="cart-count">0</span>)</a></nav>
  </header>
  <main class="page">
    <h1>Checkout</h1>
    <ul class="lines" id="lines"></ul>
    <p class="total" id="total"></p>
    <div class="checkout-form">
      <div class="field"><label for="checkout-name">Full name</label><input type="text" id="checkout-name" name="name" autocomplete="name" data-scn="checkout-name"></div>
      <div class="field"><label for="checkout-address">Shipping address</label><input type="text" id="checkout-address" name="address" autocomplete="street-address" data-scn="checkout-address"></div>
      <div class="field"><label for="checkout-card">Card number</label><input type="text" id="checkout-card" name="card" autocomplete="cc-number" inputmode="numeric" data-scn="checkout-card"></div>
    </div>
    <button type="button" id="place-order" data-scn="place-order">Place order</button>
    <p class="status" id="placed"></p>
  </main>
  <footer class="demo-note">Demo copy for testing; not affiliated with Breville.</footer>
  <script src="/assets/scenarios.js"></script>
</body>
</html>
